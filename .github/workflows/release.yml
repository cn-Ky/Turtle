name: Turtle GUI - Derle ve Yayınla

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turtle-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: GUI Derle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - label: windows-x64
            os: windows-latest
            platform: windows
            arch: x86_64
          - label: macos-arm64
            os: macos-26
            platform: macos
            arch: arm64
          - label: macos-intel
            os: macos-26-intel
            platform: macos
            arch: x86_64

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v7

      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Linux GUI sistem bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev tcl-dev libpcap0.8-dev

      - name: Python ve Tk kontrolü
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import platform
          import tkinter
          print(f"Python architecture: {platform.machine()}")
          print(f"Tk version: {tkinter.TkVersion}")
          expected = "${{ matrix.arch }}"
          actual = platform.machine().lower()
          aliases = {"amd64": "x86_64", "x64": "x86_64", "aarch64": "arm64"}
          actual = aliases.get(actual, actual)
          if actual != expected:
              raise SystemExit(f"Runner architecture mismatch: expected {expected}, got {actual}")
          PY

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Ağ yardımcı testlerini çalıştır
        run: python -m unittest discover -s tests -v

      - name: Windows GUI uygulamasını derle
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Turtle --collect-all scapy app.py

      - name: Linux GUI uygulamasını derle
        if: runner.os == 'Linux'
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Turtle --collect-all scapy app.py

      - name: macOS GUI uygulamasını derle
        if: runner.os == 'macOS'
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name Turtle --osx-bundle-identifier com.cnky.turtle
          --collect-all scapy app.py

      - name: Sürüm dosyasını paketle
        shell: bash
        env:
          TURTLE_PLATFORM: ${{ matrix.platform }}
          TURTLE_ARCH: ${{ matrix.arch }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/package_release.py

      - name: Derleme varlığını yükle
        uses: actions/upload-artifact@v7
        with:
          name: turtle-gui-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: GitHub GUI Release yayınla
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Derleme dosyalarını indir
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: SHA256 özetlerini üret
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Release oluştur veya güncelle
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}-{1}', github.run_number, github.run_attempt) }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Turtle GUI development build {0}', github.run_number) }}"
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
