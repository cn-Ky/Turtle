
name: Derle ve Yayınla

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: turtle

jobs:
  build:
    name: Derle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          # macOS Apple Silicon (ARM64)
          - os: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz

          # macOS Intel (x86_64)
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # pnet, Windows'ta bağlama (link) aşamasında Packet.lib ister (Npcap SDK).
      - name: Npcap SDK kur (yalnızca Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Derle
        run: cargo build --release --target ${{ matrix.target }}

      - name: Paketle
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          NAME="${BIN_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "$NAME/"
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$NAME/"
          fi

          cp README.md LICENSE "$NAME/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${NAME}.zip" "$NAME"
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
            echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub Release oluştur
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256 özetlerini üret
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
