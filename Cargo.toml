[package]
name = "turtle"
version = "0.1.0"
edition = "2021"
description = "Turtle: eğitim amaçlı, Türkçe ağ analiz aracı (Wi-Fi, yerel ağ keşfi, paket yakalama, port tarama)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
ctrlc = "3"
dns-lookup = "2"
pnet = "0.35"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
dirs = "5"
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
